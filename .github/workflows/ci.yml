name: BlueGuard CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python source
        run: python -m py_compile blueguard.py update.py
      - name: Check shell scripts
        run: bash -n run.sh install-deps.sh check.sh update.sh
